<style>
svg{--bg:#ffffff;--fg:#1f2328;--muted:#656d76;--grid:#e6e8eb;--old:#8c959f;--new:#2f6fd0;--ok:#1a7f37;--bad:#cf222e}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--fg)}
.m{font-size:13px}.t{font-size:11px;fill:var(--muted)}.c{font-size:12px;font-variant-numeric:tabular-nums}
.h{font-size:15px;font-weight:600}.g{stroke:var(--grid)}.ref{stroke:var(--muted);stroke-dasharray:3 3}
.o{fill:none;stroke:var(--old);stroke-width:1.5}.n{fill:var(--new);fill-opacity:.85}.md{stroke:var(--new);stroke-width:2}
.ok{fill:var(--ok)}.bad{fill:var(--bad)}.flat{fill:var(--muted)}
</style>
