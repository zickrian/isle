[package]
name = "isle-daemon"
description = "Background service behind the Isle island: media, lyrics, timers and system events over D-Bus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "isled"
path = "src/main.rs"

[dependencies]
isle-core.workspace = true

anyhow.workspace = true
chrono.workspace = true
dirs.workspace = true
env_logger.workspace = true
futures-util.workspace = true
image.workspace = true
libc.workspace = true
log.workspace = true
serde.workspace = true
# Keeps the keys of Claude Code's settings.json in their order when its hooks are changed.
serde_json = { workspace = true, features = ["preserve_order"] }
tokio.workspace = true
toml_edit.workspace = true
ureq.workspace = true
zbus.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
inotify.workspace = true
